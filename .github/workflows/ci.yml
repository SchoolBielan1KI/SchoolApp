name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  static-analysis:
    name: CI / Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Checkstyle
        run: mvn validate --no-transfer-progress

  build-and-unit-tests:
    name: CI / Build and Unit Tests
    runs-on: ubuntu-latest
    needs: static-analysis
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run unit tests
        run: mvn clean package --no-transfer-progress

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  integration-tests:
    name: CI / Integration Tests
    runs-on: ubuntu-latest
    needs: static-analysis
    env:
      # Передаємо реальну базу, щоб інтеграційні тести пройшли успішно
      MONGO_URI: mongodb+srv://belannvv_db_user:XsaqpqLuY7PoLOMh@cluster0.cbkl4qr.mongodb.net/school_db?appName=Cluster0
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Integration Tests
        # Запускаємо фазу verify, але скіпаємо юніт-тести (бо вони вже пройшли в попередній джобі)
        run: mvn verify -Dsurefire.skip=true --no-transfer-progress
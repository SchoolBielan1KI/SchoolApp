<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Онлайн-платформа школи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <h1 class="mb-4">Онлайн-платформа школи</h1>
    <a href="/add" class="btn btn-success mb-3">Додати запис</a>

    <table class="table table-bordered table-striped">
        <thead class="table-primary">
            <tr>
                <th>ПІБ учня</th>
                <th>Клас</th>
                <th>ПІБ вчителя</th>
                <th>Предмет</th>
                <th>Тема завдання</th>
                <th>Оцінка</th>
                <th>Статус уроку</th>
                <th>Дія</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="record : ${records}">
                <td th:text="${record.studentName}"></td>
                <td th:text="${record.schoolClass}"></td>
                <td th:text="${record.teacherName}"></td>
                <td th:text="${record.subject}"></td>
                <td th:text="${record.taskTheme}"></td>
                <td th:text="${record.grade}"></td>
                <td th:text="${record.lessonStatus}"></td>
                <td>
                    <form th:action="@{/delete/{id}(id=${record.id})}" method="post">
                        <button type="submit" class="btn btn-danger btn-sm">Видалити</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
